<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flight Time Agent Pro</title><style>body{font-family:Segoe UI,Arial;background:#eef3f8;padding:20px;max-width:1100px;margin:auto}.card{background:#fff;border-radius:12px;padding:18px;margin:15px 0;box-shadow:0 2px 8px rgba(0,0,0,.12)}h1{color:#0b5394} input,button,select{padding:8px;margin:4px}button{background:#0b5394;color:#fff;border:none;border-radius:6px;cursor:pointer}.result{font-weight:bold;color:#0b5394;font-size:18px}</style></head><body><h1>Flight Time Agent Pro (UTC)</h1><div class='card'><h2>Feature 1: Calculate Flight Time from Start Engine / Stop Engine</h2><input id='start1' placeholder='Start Engine UTC e.g. 0800 or 08:00'><input id='stop1' placeholder='Stop Engine UTC e.g. 0945 or 09:45'><button onclick='calcFlight()'>Calculate</button><div id='r1' class='result'></div></div><div class='card'><h2>Feature 2: Find the Missing Time from Required Flight Duration</h2><input id='duration' placeholder='Flight Duration e.g. 1:30 or 0130'><br><input id='start2' placeholder='Start Engine UTC'><button onclick='findStop()'>Find Stop Engine</button><br><input id='stop2' placeholder='Stop Engine UTC'><button onclick='findStart()'>Find Start Engine</button><div id='r2' class='result'></div></div><script>function parseTime(t){t=t.trim();if(t.includes(':')){let p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]);}t=t.padStart(4,'0');return parseInt(t.slice(0,2))*60+parseInt(t.slice(2,4));}function parseDuration(t){t=t.trim();if(t.includes(':')){let p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]);}t=t.padStart(4,'0');return parseInt(t.slice(0,2))*60+parseInt(t.slice(2,4));}function fmt(m){m=((m%1440)+1440)%1440;let h=Math.floor(m/60);let mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');}function fmtDur(m){let h=Math.floor(m/60);let mm=m%60;return h+':'+String(mm).padStart(2,'0');}function calcFlight(){let s=parseTime(document.getElementById('start1').value);let e=parseTime(document.getElementById('stop1').value);let d=e-s;if(d<0)d+=1440;document.getElementById('r1').innerHTML='Flight Time = '+fmtDur(d)+' hours';}function findStop(){let dur=parseDuration(document.getElementById('duration').value);let start=parseTime(document.getElementById('start2').value);document.getElementById('r2').innerHTML='Stop Engine UTC = '+fmt(start+dur);}function findStart(){let dur=parseDuration(document.getElementById('duration').value);let stop=parseTime(document.getElementById('stop2').value);document.getElementById('r2').innerHTML='Start Engine UTC = '+fmt(stop-dur);}</script></body></html>
